plugins {
    id 'com.gradleup.shadow'
    id "me.shedaniel.unified-publishing" version "0.1.+"
}
loom {
    forge {
        mixinConfig "hdr_mod.mixins.json"
    }
    runs {
        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}
architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "forge"
        url = "https://files.minecraftforge.net/maven"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url "https://jitpack.io" }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.lwjgl' && details.requested.name.startsWith('lwjgl') && details.requested.name.startsWith('lwjgl') && !details.requested.name.contains("vulkan") && !details.requested.name.contains("vma")) {
            details.useVersion '3.3.1'
        }
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.4"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.5.4"))

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    modImplementation "me.shedaniel.cloth:cloth-config-forge:${cloth_config_api_version}"
    modCompileOnly "maven.modrinth:oculus:${minecraft_version}-${oculus_version}"
    modLocalRuntime "maven.modrinth:embeddium:${embeddium_version}+mc${minecraft_version}"
    modLocalRuntime "maven.modrinth:oculus:${minecraft_version}-${oculus_version}"
    modImplementation "curse.maven:reforgedplay-mod-1018692:5637596"
    modCompileOnly "maven.modrinth:imblocker-original:${imblocker_version}-fabric,${minecraft_version}"
    //modLocalRuntime files("/home/david/Minecraft-HDR-Mod/libs/IMBlocker-5.5.3-dev-forge+1.17-1.20.4.jar")
    modImplementation "maven.modrinth:ixeris:${ixeris_version}+${minecraft_version}-fabric"

    forgeRuntimeLibrary "io.github.spair:imgui-java-app:$imgui_version"
    forgeRuntimeLibrary "io.github.spair:imgui-java-binding:$imgui_version"
    forgeRuntimeLibrary "io.github.spair:imgui-java-lwjgl3:$imgui_version"
    forgeRuntimeLibrary "org.lwjgl:lwjgl-vulkan:3.3.6"
    forgeRuntimeLibrary "org.lwjgl:lwjgl-vma:3.3.6"
    forgeRuntimeLibrary "org.lwjgl:lwjgl-vma::natives-windows"
    forgeRuntimeLibrary "org.lwjgl:lwjgl-vma::natives-linux"
    forgeRuntimeLibrary "net.neoforged:bus:8.0.5"
    modLocalRuntime "maven.modrinth:superresolution:${minecraft_version}-${sr_version}+gl-forge"

    localRuntime "org.anarres:jcpp:1.4.14"
    include "org.anarres:jcpp:1.4.14"
    forgeRuntimeLibrary "org.anarres:jcpp:1.4.14"

    implementation 'ar.com.hjg:pngj:2.1.0'
    forgeRuntimeLibrary 'ar.com.hjg:pngj:2.1.0'
    include 'ar.com.hjg:pngj:2.1.0'

    implementation "com.github.ReplayMod:lwjgl-utils:27dcd66"
    forgeRuntimeLibrary "com.github.ReplayMod:lwjgl-utils:27dcd66"

    implementation "com.github.viaversion:opennbt:0a02214"
    forgeRuntimeLibrary "com.github.viaversion:opennbt:0a02214"

    implementation "org.apache.commons:commons-exec:1.3"
    forgeRuntimeLibrary "org.apache.commons:commons-exec:1.3"

    //modLocalRuntime "maven.modrinth:renderscale:1.3.6"

}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

publishMods {
    file = remapJar.archiveFile
}