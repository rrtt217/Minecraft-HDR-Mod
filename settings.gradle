pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://files.minecraftforge.net/maven/' }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'hdr_mod'

include 'common', 'fabric', 'neoforge'

// Vendored, self-contained wayland-java sources (see vendor/README.md).
// It is a plain java-library, not a Minecraft project, so the root build
// skips it in allprojects/subprojects.
include 'vendor:wayland-lite'