architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = "https://nexus.nyat.icu/repository/maven-snapshots/"
        content {
            includeGroup "io.homo.superresolution"
        }
        mavenContent {
            snapshotsOnly()
        }
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_api_version}"
    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    modImplementation "maven.modrinth:iris:${iris_version}+${minecraft_version}-fabric"
    modImplementation "maven.modrinth:sodium:mc${minecraft_version}-${sodium_version}-fabric"
    modImplementation "maven.modrinth:imblocker-original:${imblocker_version}-fabric,${minecraft_version}"
    modImplementation "maven.modrinth:ixeris:${ixeris_version}+${minecraft_version}-fabric"
    modImplementation "maven.modrinth:replaymod:1.21.11-2.6.25"
    modImplementation "maven.modrinth:superresolution:${minecraft_version}-${sr_version}+gl-fabric"

    implementation "org.lwjgl:lwjgl-vulkan:3.3.6"
    implementation "org.lwjgl:lwjgl-vma:3.3.6"
    implementation "org.lwjgl:lwjgl-vma::natives-windows"
    implementation "org.lwjgl:lwjgl-vma::natives-linux"
    implementation 'com.github.oshi:oshi-core:6.9.3'
    implementation 'ar.com.hjg:pngj:2.1.0'
}
